id: meta-blueprint
name: Meta Blueprint Forge
status: CANONICAL
stages:
  - id: validate-blueprint
    name: 验证 Blueprint 结构
    deps: []
    proof:
      target:
        description: Blueprint YAML 文件
        glob: "**/*.yaml"
      spec:
        description: 验证 Blueprint YAML 结构
        constraints:
          - "必须包含 id, name, stages"
          - "stages 必须是数组"
          - "每个 stage 必须包含 id, name, proof"
          - "id 和 name 必须是字符串"
      probes:
        - type: fs_exists
          pattern: "**/*.yaml"