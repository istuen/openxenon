id: fs-match
name: File System Content Match Probe
type: fs_match
description: 检查文件中是否匹配正则表达式
semantics:
  intent: 验证文件内容匹配正则表达式
  tags: ["文件系统", "内容匹配", "fs", "regex"]
  useWhen: 当你需要确认某个文件包含特定内容时
  relatedAssets: ["fs_exists", "fs_not_exists"]
parameters:
  - name: pattern
    type: string
    description: 文件路径（相对于 projectRoot）
  - name: contains
    type: string
    description: 正则表达式（可选，匹配文件内容）
spec:
  description: 验证文件内容匹配正则表达式
  constraints:
    - "pattern 必须是字符串"
    - "contains 必须是字符串（可选）"