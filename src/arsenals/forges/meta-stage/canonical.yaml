id: meta-stage
name: Meta Stage Forge
status: CANONICAL
stages:
  - id: validate-stage
    name: 验证 Stage 结构
    deps: []
    target:
      description: Stage YAML 文件
      glob: "**/*.yaml"
    spec:
      description: 验证 Stage YAML 结构
      constraints:
        - "必须包含 id, name"
        - "必须包含 target (可选)"
        - "必须包含 spec (可选)"
        - "必须包含 probes"
        - "deps 必须是字符串数组"
        - "probes 必须是数组"
    probes:
      - type: fs_exists
        pattern: "**/*.yaml"