name: automation
description: "检查自动化流程（CI/CD、测试、部署）的完整性"
scope:
  - project_structure
  - arsenal_manifest
output: automation-report.md
rules:
  - name: missing-ci-config
    description: "项目无 CI 配置"
    level: warning
    condition: "fileExists('.github/workflows/*|.gitlab-ci.yml|Jenkinsfile|tox.ini|Makefile')"
    message: "未检测到 CI 配置文件"
  - name: missing-gitignore
    description: "项目无 .gitignore"
    level: info
    condition: "fileExists('.gitignore')"
    message: "项目根目录缺少 .gitignore 文件"
