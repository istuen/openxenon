name: Publish to npm

# 触发: 推送 v*.*.* tag (e.g. v0.1.6, v0.2.0)
# 手动: workflow_dispatch 可输入自定义 tag
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.6). 默认取当前 HEAD 的 tag.'
        required: false

permissions:
  contents: read       # 读仓库 (checkout)
  id-token: write      # OIDC npm provenance (可选, 但推荐)

jobs:
  publish:
    runs-on: ubuntu-latest
    # 不允许 main 分支上的 concurrency 互相阻塞
    # tag push 跑完后, 同一 tag 多次 push 走同 group
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Build (clean + langium + dist + types)
      # 注: typecheck/lint/test 已在 ci.yml (push to main) 与 runtime.yml (push to main/feat/**)
      # 跑过, dev 分支推 tag 时这些 CI 已 validate 完毕, 这里不再重复.
      - name: Build
        run: bun run build

      # 验证产物
      - name: Verify dist/
        run: |
          test -f dist/cli.js || (echo "ERROR: dist/cli.js not found" && exit 1)
          head -1 dist/cli.js | grep -q '^#!' || (echo "ERROR: dist/cli.js missing shebang" && exit 1)
          ls -lh dist/

      # Publish to npm (scoped public, 凭据 secrets.NPM_TOKEN)
      - name: Publish @istuen/openxenon to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 验证发布成功
      - name: Verify published version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Published version: $VERSION"
          sleep 10  # npm registry 传播延迟
          npm view @istuen/openxenon@$VERSION version

      # 端到端 smoke test
      - name: Smoke test (npx --version)
        run: npx -y @istuen/openxenon@$VERSION --version
