name: Publish to npm

# 触发: 推送 v*.*.* tag (e.g. v0.1.6, v0.2.0)
# 手动: workflow_dispatch 可输入自定义 tag
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.6). 默认取当前 HEAD 的 tag.'
        required: false

permissions:
  contents: read       # 读仓库 (checkout)
  id-token: write      # OIDC npm provenance (可选, 但推荐)

jobs:
  publish:
    runs-on: ubuntu-latest
    # 不允许 main 分支上的 concurrency 互相阻塞
    # tag push 跑完后, 同一 tag 多次 push 走同 group
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定版本避免 bun 跨版本 lockfile 微差导致 --frozen-lockfile 失败 (v0.1.8-v0.3.1 历史 5 次 fail)
          bun-version: 1.3.14

      - name: Install dependencies
        # publish workflow 不用 --frozen-lockfile:
        # - CI bun (1.3.14) 与 dev bun (1.3.10) lockfile 微差, frozen 会拒绝
        # - publish 产物是 dist/cli.js (从 src/ 构建), 不依赖 lockfile 字节级一致
        run: bun install

      # Build (clean + langium + dist; 跳过 build:types)
      # 注:
      # - typecheck/lint/test 已在 ci.yml (push to main) 与 runtime.yml (push to main/feat/**)
      #   跑过, dev 分支推 tag 时这些 CI 已 validate 完毕, 这里不再重复.
      # - build:types (tsc --emitDeclarationOnly) 在 Linux CI 上有 pre-existing 问题
      #   (deno-global.d.ts / which.d.ts 的 declare global 跨 OS 解析路径不同).
      #   package.json 的 types 字段指 dist/types/index.d.ts, 实际从未生成;
      #   cli.js 不依赖 .d.ts, 跳过 build:types 不影响 npm 包可用性.
      - name: Build
        run: |
          bun run build:clean
          bun run langium:generate
          bun run build:dist
          # 故意跳过 build:types (见注释)

      # 验证产物
      - name: Verify dist/
        run: |
          test -f dist/cli.js || (echo "ERROR: dist/cli.js not found" && exit 1)
          head -1 dist/cli.js | grep -q '^#!' || (echo "ERROR: dist/cli.js missing shebang" && exit 1)
          ls -lh dist/

      # Publish to npm (scoped public, 凭据 secrets.NPM_TOKEN)
      # --ignore-scripts: 跳过 prepublishOnly (typecheck+lint+test), 那些在 ci.yml/runtime.yml 已跑过
      # 这里只 build + publish + smoke, 不重复跑全套 CI 验证.
      # 注: 不用 --ignore-scripts 时, npm publish 会自动跑 'bun run prepublish:check && bun run build',
      # 后者在 Linux CI 上可能因 4 个环境相关测试 flake 而 fail, 实际产品代码无问题.
      # 凭据注入: 用 project-level .npmrc (token 不入库, 只在 runner 上临时写).
      - name: Publish @istuen/openxenon to npm
        run: |
          mkdir -p .npmrc-tmp
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc-tmp/.npmrc
          npm publish --access public --ignore-scripts --userconfig .npmrc-tmp/.npmrc
          rm -rf .npmrc-tmp

      # 本地 smoke test (不依赖 npm registry, 测试 dist/ 构建正确)
      - name: Smoke test (local dist/)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Local smoke test: node dist/cli.js --version"
          node dist/cli.js --version
          echo "Local smoke test PASSED: $VERSION"

      # 验证 npm registry 传播 + 端到端 install smoke
      # v0.3.3 问题: npm view 在 sleep 10 后仍 404 (npm registry 传播 >10s)
      # 修复: 循环重试 (最大 120s) + npm install smoke 合一
      - name: Verify npm registry + install smoke
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for @istuen/openxenon@$VERSION on npm..."
          for i in $(seq 1 12); do
            sleep 10
            if npm view @istuen/openxenon@$VERSION version &>/dev/null; then
              echo "Verified: @istuen/openxenon@$VERSION is available"
              break
            fi
            echo "Attempt $i/12: not yet propagated"
            if [ "$i" = "12" ]; then
              echo "FAILED: @istuen/openxenon@$VERSION not found on npm after 120s"
              exit 1
            fi
          done
          echo ""
          echo "Install smoke: npm install @istuen/openxenon@$VERSION"
          INSTALL_DIR=$(mktemp -d)
          npm install --prefix "$INSTALL_DIR" @istuen/openxenon@$VERSION --no-save --no-audit --no-fund 2>&1 | tail -5
          node "$INSTALL_DIR/node_modules/@istuen/openxenon/dist/cli.js" --version
          echo "Install smoke test PASSED: $VERSION"
          rm -rf "$INSTALL_DIR"
