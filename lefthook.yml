pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,js,json}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    eslint-arch:
      glob: "src/**/*.ts"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    typecheck:
      run: pnpm run typecheck
    heading-skeleton:
      glob: "**/*.md"
      run: bun scripts/check-heading-skeleton.ts .openxenon/drafts/
    doc-boundary:
      glob: "**/*.md"
      run: bun scripts/check-doc-boundary.ts
    asset-structure:
      # NpmSupplyChainAdvisory.md 是 chmod 0o444 只读 advisory 文件，不属于常规 Asset 范围
      # 见 .openxenon/drafts/design-asset-structure-unification.md §4.3 Phase 3 范围
      glob: ".openxenon/assets/**/*.md"
      exclude: ".openxenon/assets/domains/NpmSupplyChainAdvisory.md"
      run: bun scripts/check-asset-structure.ts
    naming:
      glob: ".openxenon/**/*.md"
      run: bun scripts/check-naming.ts
    md-canonical:
      glob: ".openxenon/drafts/**/*.md"
      run: bun scripts/check-md-canonical.ts .openxenon/drafts/
    adr-landing:
      glob: "docs/adrs/*.md"
      run: bun scripts/check-adr-landing.ts
    versioned-docs:
      glob: "docs/{dev,rfc,adrs}/**/*.md"
      run: bun scripts/check-versioned-docs.ts

pre-push:
  parallel: true
  commands:
    test:
      run: bun test
    intent-types-drift:
      # CI 守卫（detect L1-OXL vs L3-CLI Intent 类型漂移）
      run: bun scripts/check-intent-types-drift.ts
    no-langium-usage:
      # CI 守卫（fatal：禁止新代码引入 Langium）
      run: bun scripts/check-no-new-langium-usage.ts
    md-fallback-stats:
      # INFO 等级（.oxn fallback 数量观察期工具，不阻断）
      run: bun scripts/check-md-fallback-stats.ts
