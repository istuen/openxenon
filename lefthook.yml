pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,js,json}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    eslint-arch:
      glob: "src/**/*.ts"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    typecheck:
      run: pnpm run typecheck
    heading-skeleton:
      glob: "**/*.md"
      run: bun scripts/check-heading-skeleton.ts .openxenon/drafts/
    doc-boundary:
      glob: "**/*.md"
      run: bun scripts/check-doc-boundary.ts
    versioned-docs:
      glob: "docs/{dev,rfc,adrs}/**/*.md"
      run: bun scripts/check-versioned-docs.ts

pre-push:
  commands:
    test:
      run: bun test
