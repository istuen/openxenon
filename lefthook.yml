pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,js,json}"
      run: bunx biome check --staged --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    eslint-arch:
      glob: "src/**/*.ts"
      run: bunx eslint {staged_files}
    typecheck:
      run: bun run typecheck

pre-push:
  commands:
    test:
      run: bun test
