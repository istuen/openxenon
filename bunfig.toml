# =============================================================================
# OpenXenon — Bun test configuration
#
# Goal: maximize parallelism while keeping E2E tests that share the `.openxenon/`
# workspace serialized (Bun.spawn + shared FS state would race otherwise).
#
# Strategy:
#   - Default: tests run serially within a file (Bun default).
#   - concurrentTestGlob: any test file matching this glob runs concurrently
#     WITHIN that file (per-test concurrency). The bulk of our suite is pure
#     logic (kernel/dsl/work/daemon/schema/errors/skills locales) and is safe.
#   - E2E files (src/cli/__tests__/*-e2e.test.ts) and cross-layer integration
#     tests (tests/integration/**) are deliberately NOT in the glob, so they
#     stay serial — they share `/tmp/oxn-…` and the real `.openxenon/` index,
#     and concurrent `Bun.spawn` calls have historically caused work-migrate-e2e
#     to flake.
#
# Test layout (Y scheme — tests reflect architecture boundary, not source):
#   - src/<mod>/__tests__/      module unit tests
#   - tests/architectural/      L0-L3 constitutional guards
#   - tests/integration/        cross-layer integration (L0+L1+L3)
#   - src/cli/__tests__/        E2E black-box CLI tests
#
# Verified: 2025-12, after H1-H5 + M2 + Y-scheme regroup. Wall ~50s → 45s.
# =============================================================================

[test]

# Pure unit / integration / schema / langium parser / skill-content tests:
# these are isolated and safe to run concurrently within a file.
concurrentTestGlob = [
  "src/core/errors/__tests__/**",
  "src/oxl/__tests__/**",
  "src/oxl/compiler/__tests__/**",
  "src/work/__tests__/**",
  "src/skills/**",
  "src/cli/__tests__/task-filesystem.test.ts",
  "src/daemon/__tests__/**",
  "src/kernel/__tests__/**",
  "tests/architectural/**",
]

# E2E tests in src/cli/__tests__/ (work-*-e2e.test.ts etc) and cross-layer
# integration tests in tests/integration/ deliberately omitted so they
# default to serial execution.

# Retry once on failure: absorbs the historical work-migrate-e2e:320 flake
# (concurrent Bun.spawn + shared `.openxenon/` cache). Net cost ~250ms when
# triggered; gives a robust green CI signal without hiding real bugs.
retry = 1
